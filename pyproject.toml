[project]
name = "tree-sitter-typescript-generator"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=2.0",
    "tree-sitter>=0.26.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py312"
line-length = 120
include = ["arkts_gen/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # Pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "S110",    # try-except-pass
    "RUF013",  # implicit Optional
    "PERF102", # dict.keys()/values() in loop when .items()/.values() not needed
    "PIE794",  # duplicate class field definition
    "PLC0415", # disallow imports outside top-level (no imports inside methods/functions)
]
ignore = [
    "E501",    # let `ruff format` handle line length
    "E741",    # ambiguous variable names
    "SIM1",    # overly opinionated simplify rules
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
